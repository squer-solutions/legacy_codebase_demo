# Workshop stack: "Make Legacy Codebase Searchable"
#
#   docker compose up --build                         -> Qdrant (localhost:6333) + JupyterLab (http://localhost:8888/?token=workshop)
#   docker compose --profile warmup run --rm warmup   -> pre-download the embedding model before the workshop
#   docker compose down -v                            -> stop everything and drop the Qdrant volume
#
# Everything runs locally: the embedding model on CPU inside the notebook container, Qdrant as a local server.
name: legacy-codebase-workshop

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: workshop-qdrant
    ports:
      - "6333:6333"   # REST + dashboard: http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  notebook:
    build:
      context: ./docker
      dockerfile: notebook.Dockerfile
    container_name: workshop-notebook
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333            # read by the notebook's Setup cell
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-workshop}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}      # set to 1 once the model is cached to avoid any network access
      TOKENIZERS_PARALLELISM: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-} # only needed for the optional LLM bonus cell (ask_claude_code)
    volumes:
      - .:/workspace                                                   # notebook, data/, CardDemo sources
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface # reuse the host's model cache (BAAI/bge-large-en-v1.5)
    ports:
      - "8888:8888"
    restart: unless-stopped

  # One-shot helper: downloads the embedding model into the shared cache (run once before the workshop).
  warmup:
    profiles: ["warmup"]
    build:
      context: ./docker
      dockerfile: notebook.Dockerfile
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    command: >
      python -c "from sentence_transformers import SentenceTransformer;
      m = SentenceTransformer('BAAI/bge-large-en-v1.5', device='cpu');
      print('model cached, dims =', m.get_sentence_embedding_dimension())"

volumes:
  qdrant_storage:
