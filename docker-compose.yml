# Workshop stack: "Make Legacy Codebase Searchable"
#
# The Jupyter notebook runs on the host as usual. Only the two backends run in Docker:
#
#   qdrant       local vector database        -> http://localhost:6333   (dashboard: /dashboard)
#   embeddings   local embedding model server -> http://localhost:8080   (POST /embed, GET /health)
#
# Host ports are configurable via .env / environment: QDRANT_PORT, QDRANT_GRPC_PORT, EMBED_PORT.
# If you change them, point the notebook at the new ports with QDRANT_URL / EMBED_URL before starting Jupyter.
#
#   docker compose up --build -d     start both services
#   docker compose logs -f embeddings   watch the model load (≈ 15–30 s, longer on first download)
#   docker compose down              stop (add -v to drop the Qdrant volume)
#
# The notebook picks the services up automatically via QDRANT_URL / EMBED_URL (defaults below) and
# falls back to in-process Qdrant + in-process sentence-transformers if the services are not reachable.
name: legacy-codebase-workshop

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: workshop-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"        # REST + dashboard – override QDRANT_PORT if another Qdrant already uses 6333
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Embedding model server. Serves BAAI/bge-large-en-v1.5 with sentence-transformers on CPU and exposes the
  # same HTTP API as Hugging Face Text Embeddings Inference (POST /embed {"inputs": [...]} -> [[...], ...]).
  # Built locally so it runs on Apple Silicon (arm64) as well as x86_64. On an x86_64 host you can swap it for
  # the official TEI image:  image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
  #                          command: --model-id BAAI/bge-large-en-v1.5 --port 80
  embeddings:
    build:
      context: ./docker
      dockerfile: embeddings.Dockerfile
    container_name: workshop-embeddings
    environment:
      MODEL_ID: ${EMBED_MODEL:-BAAI/bge-large-en-v1.5}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}      # set to 1 once the model is cached to forbid any network access
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface   # reuse the host's model cache (≈1.3 GB, no re-download)
    ports:
      - "${EMBED_PORT:-8080}:80"           # override EMBED_PORT if 8080 is taken
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  qdrant_storage:
